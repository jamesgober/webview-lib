# =============================================================================
#  R E P S   ·   webview-lib
# =============================================================================
[package]
name    = "webview-lib"
version = "0.1.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "A native window hosting the OS webview: WebView2 on Windows, WKWebView on macOS, WebKitGTK on Linux, by raw FFI, no frameworks."

# Keywords (5 max)
keywords = ["webview", "gui", "window", "webview2", "wkwebview"]

# Categories
categories = ["gui", "os"]

# Links
homepage      = "https://github.com/jamesgober/webview-lib"
repository    = "https://github.com/jamesgober/webview-lib"
documentation = "https://docs.rs/webview-lib"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "webview_lib"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
default = ["std"]
std = []


# DEPENDENCIES
# #################################
[dependencies]
# First-party -lang dependencies are wired at v0.2.0, when first used.


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest  = "1"


# BENCHMARKS
# #################################
[[bench]]
name    = "bench"
harness = false


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
